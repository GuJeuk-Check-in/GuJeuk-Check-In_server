name: Beopdong CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "apps/beopdong-api/**"
      - "shared/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/beopdong-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "apps/beopdong-api/**"
      - "shared/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/beopdong-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify Beopdong and shared modules
        run: ./gradlew :apps:beopdong-api:build :shared:common:build
