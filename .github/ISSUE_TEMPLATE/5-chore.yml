name: 🧹 기타 작업
description: 설정, 인프라, 문서, 테스트 등 기능 외 작업입니다
title: "[CHORE] "
labels: ["🧹 Chore"]
body:
  - type: markdown
    attributes:
      value: |
        > **브랜치** `chore/#이슈번호-브랜치네임` · **커밋** `chore(#이슈번호) :: 메시지`

  - type: dropdown
    id: kind
    attributes:
      label: 🗂️ 작업 종류
      options:
        - ⚙️ Setting (프로젝트 세팅)
        - 🧹 Chore (잡일)
        - 📚 Docs (문서)
        - ✅ Test (테스트)
        - 🧶 Style (코드 스타일)
        - build / ci (빌드·파이프라인)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 📋 작업 설명
      placeholder: CI 파이프라인에 테스트 단계를 추가합니다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 🚧 작업 내용
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 📎 참고 자료
