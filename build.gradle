plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

def javaModules = [project(':apps:gujeuk-api'), project(':apps:beopdong-api'), project(':shared:common')]

configure(javaModules) {
    apply plugin: 'java'

    group = 'com.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// Keep root-level convenience commands while each module remains independently buildable.
tasks.named('clean') {
    dependsOn javaModules.collect { "${it.path}:clean" }
}

tasks.named('build') {
    dependsOn javaModules.collect { "${it.path}:build" }
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs tests in all Java modules.'
    dependsOn javaModules.collect { "${it.path}:test" }
}

tasks.register('compileJava') {
    group = 'build'
    description = 'Compiles all Java modules.'
    dependsOn javaModules.collect { "${it.path}:compileJava" }
}

tasks.register('bootJar') {
    group = 'build'
    description = 'Builds the existing Gujeuk executable JAR.'
    dependsOn ':apps:gujeuk-api:bootJar'
}

tasks.register('bootRun') {
    group = 'application'
    description = 'Runs the existing Gujeuk application.'
    dependsOn ':apps:gujeuk-api:bootRun'
}
